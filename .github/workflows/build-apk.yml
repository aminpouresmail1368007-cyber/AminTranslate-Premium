name: Build AminTranslate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recreate Android project
        shell: bash
        run: |
          curl -L "https://raw.githubusercontent.com/aminpouresmail1368007-cyber/AminTranslate-Premium/af40a89f3579dc78c05829a6e48753236b07ae5f/.github/workflows/build-apk.yml" -o old-workflow.yml
          awk '/cat > project.b64/{flag=1;next}/^EOF_PROJECT$/{flag=0}flag' old-workflow.yml > project.b64
          base64 -d project.b64 > project.zip
          unzip -q project.zip

      - name: Fix Android XML namespaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("AminTranslate_Android_Premium/app/src/main/res/layout/activity_about.xml"),
              Path("AminTranslate_Android_Premium/app/src/main/res/layout/activity_settings.xml"),
          ]

          for p in files:
              s = p.read_text(encoding="utf-8")
              if 'xmlns:app=' not in s:
                  s = s.replace(
                      'xmlns:android="http://schemas.android.com/apk/res/android"',
                      'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto"',
                      1
                  )
              p.write_text(s, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: AminTranslate_Android_Premium
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AminTranslate-Premium-APK
          path: AminTranslate_Android_Premium/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
