      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: AminTranslate_Android_Premium
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AminTranslate-Premium-APK
          path: AminTranslate_Android_Premium/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
